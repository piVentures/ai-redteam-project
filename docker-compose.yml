services:
  api-vuln:
    build: .
    container_name: redteam-api-vuln
    mem_limit: 1g
    cpus: 1.0
    environment:
      - SECURITY_MODE=vulnerable
      - MODEL_PATH=model/artifacts/baseline.pt
      - LOG_DIR=logs
      - PYTHONDONTWRITEBYTECODE=1
    ports:
      - "8000:8000"
    volumes:
      - ./model/artifacts:/srv/model/artifacts:ro
      - ./logs:/srv/logs
      - ./results:/srv/results
      # Bind mounts for hot reload — code changes apply on restart
      - ./domain:/srv/domain:ro
      - ./services:/srv/services:ro
      - ./usecases:/srv/usecases:ro
      - ./adapters:/srv/adapters:ro
      - ./interfaces:/srv/interfaces:ro
      - ./defense:/srv/defense:ro

  api-hardened:
    build: .
    container_name: redteam-api-hardened
    mem_limit: 1g
    cpus: 1.0
    environment:
      - SECURITY_MODE=hardened
      - MODEL_PATH=model/artifacts/baseline_robust.pt
      - LOG_DIR=logs
      - API_KEY=${API_KEY:-dev-local-key-change-me}
      - PYTHONDONTWRITEBYTECODE=1
    ports:
      - "8001:8000"
    volumes:
      - ./model/artifacts:/srv/model/artifacts:ro
      - ./logs:/srv/logs
      - ./results:/srv/results
      - ./domain:/srv/domain:ro
      - ./services:/srv/services:ro
      - ./usecases:/srv/usecases:ro
      - ./adapters:/srv/adapters:ro
      - ./interfaces:/srv/interfaces:ro
      - ./defense:/srv/defense:ro

  detector:
    build: .
    container_name: redteam-detector
    command: ["python", "-m", "interfaces.detector_main"]
    working_dir: /srv
    mem_limit: 256m
    cpus: 0.5
    environment:
      - PREDICTIONS_LOG=logs/predictions.jsonl
      - ALERTS_LOG=results/alerts.jsonl
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./logs:/srv/logs
      - ./results:/srv/results
      - ./domain:/srv/domain:ro
      - ./services:/srv/services:ro
      - ./usecases:/srv/usecases:ro
      - ./adapters:/srv/adapters:ro
      - ./interfaces:/srv/interfaces:ro
      - ./defense:/srv/defense:ro
    depends_on:
      - api-vuln

  alerts-api:
    build: .
    container_name: redteam-alerts-api
    command: ["uvicorn", "interfaces.alerts_main:app", "--host", "0.0.0.0", "--port", "8002"]
    working_dir: /srv
    mem_limit: 128m
    cpus: 0.5
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    ports:
      - "8002:8002"
    volumes:
      - ./results:/srv/results
      - ./domain:/srv/domain:ro
      - ./services:/srv/services:ro
      - ./usecases:/srv/usecases:ro
      - ./adapters:/srv/adapters:ro
      - ./interfaces:/srv/interfaces:ro
      - ./defense:/srv/defense:ro
    depends_on:
      - detector

  telegram-notifier:
    build:
      context: .
      dockerfile: Dockerfile.notifier
    container_name: redteam-telegram-notifier
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
    environment:
      - ALERTS_LOG=results/alerts.jsonl
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - NOTIFIER_POLL_SECONDS=5
      - NOTIFIER_BATCH_SECONDS=30
    volumes:
      - ./results:/srv/results:ro
    working_dir: /srv
    depends_on:
      - detector
